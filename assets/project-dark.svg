<text x="28" y="96" class="m in" style="animation-delay:.3s"># explainable early warning for population health · simulated data</text>
<text x="28" y="122" class="in" style="animation-delay:.5s"><tspan class="a">signals    </tspan>7 feeds · clinic, lab, workplace, occupational, environment</text>
<text x="28" y="146" class="in" style="animation-delay:.7s"><tspan class="a">replayed   </tspan>11 areas · 5 months, day by day</text>
<text x="28" y="170" class="in" style="animation-delay:.9s"><tspan class="a">outbreaks  </tspan><tspan class="t">2/2 caught</tspan> · 3–5 days before the harm peak</text>
<text x="28" y="194" class="in" style="animation-delay:1.1s"><tspan class="a">precision  </tspan><tspan class="t">80%</tspan> · 1 false alarm</text>
