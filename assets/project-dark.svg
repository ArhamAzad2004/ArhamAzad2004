<title id="t">health-early-warning back-test</title>
<desc id="d">Back-test on simulated data: 7 signals across 11 areas over 5 months. Both outbreaks caught 3 to 5 days before the harm peak, 80% precision, 1 false alarm. Known gap: one site missed in the dust-storm scenario.</desc>
